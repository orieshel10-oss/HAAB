<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HAAB - הסכמי נוכחות</title>
<meta name="theme-color" content="#2f6fed" />
<link rel="icon" href="../icons/icon-192.png" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="admin.css" />
<script src="admin-common.js"></script>
</head>
<body>
<div class="admin-wrap">
  <header class="admin-header">
    <img src="../icons/icon-192.png" alt="HAAB" />
    <h1>הסכמי נוכחות</h1>
    <a href="dashboard.html">חזרה</a>
  </header>

  <div class="admin-content">
    <section class="admin-section">
      <div class="admin-section-head">
        <h2>קטלוג הסכמים</h2>
        <button class="btn btn-primary btn-small" id="new-agr-btn">+ הסכם חדש</button>
        <button class="btn btn-secondary btn-small" id="ai-assist-btn">יצירה עם עוזר AI</button>
      </div>

      <div class="ai-chat-panel hidden" id="ai-chat-panel">
        <div class="ai-chat-head">
          <h3>עוזר AI להגדרת הסכם</h3>
          <button type="button" class="btn btn-secondary btn-small" id="ai-chat-close-btn">סגירה</button>
        </div>
        <div class="ai-chat-messages" id="ai-chat-messages"></div>
        <div class="ai-chat-summary hidden" id="ai-chat-summary">
          <div id="ai-chat-summary-text"></div>
          <button type="button" class="btn btn-primary btn-small" id="ai-chat-fill-btn">מילוי הטופס</button>
        </div>
        <div class="ai-chat-input-row">
          <textarea id="ai-chat-input" rows="2" placeholder="תארו את ההסכם, ושוחחו עם העוזר..."></textarea>
          <div class="ai-chat-actions">
            <button type="button" class="btn btn-primary btn-small" id="ai-chat-send-btn">שליחה</button>
            <button type="button" class="btn btn-secondary btn-small" id="ai-chat-finish-btn">סיום השיחה וגזירת השדות</button>
          </div>
        </div>
        <div class="form-msg error" id="ai-chat-msg"></div>
      </div>
      <table class="admin-table">
        <thead><tr><th>קוד</th><th>שם</th><th>תקן יום</th><th>יום מקוצר</th><th>יום מנוחה</th><th></th><th></th><th></th></tr></thead>
        <tbody id="agr-tbody"><tr class="empty-row"><td colspan="8">טוען...</td></tr></tbody>
      </table>

      <form class="admin-form hidden" id="agr-form">
        <div class="form-row">
          <div><label>קוד הסכם (4 תווים)</label><input id="agr-code" maxlength="4" required /></div>
          <div><label>שם ההסכם (עד 20 תווים)</label><input id="agr-name" maxlength="20" required /></div>
        </div>
        <div><label>תיאור (לא חובה)</label><textarea id="agr-desc"></textarea></div>
        <div>
          <label>הגדרת ההסכם - טקסט חופשי (ישמש בעתיד לניתוח נוכחות)</label>
          <textarea id="agr-prompt" maxlength="4000" rows="4"></textarea>
        </div>
        <div class="form-row">
          <div><label>תקן יום רגיל (HH:MM)</label><input id="agr-day-standard" placeholder="08:00" required /></div>
          <div><label>תקן יום מקוצר (HH:MM)</label><input id="agr-short-standard" placeholder="07:00" required /></div>
        </div>
        <div class="form-row">
          <div>
            <label>יום מנוחה שבועי</label>
            <select id="agr-rest-day">
              <option value="0">ראשון</option><option value="1">שני</option><option value="2">שלישי</option>
              <option value="3">רביעי</option><option value="4">חמישי</option><option value="5">שישי</option>
              <option value="6" selected>שבת</option>
            </select>
          </div>
          <div><label>מספר ימי עבודה בשבוע</label><input id="agr-workdays" type="number" min="1" max="7" value="6" required /></div>
        </div>
        <div>
          <label>לוח חגים מקושר</label>
          <select id="agr-holiday-calendar">
            <option value="jewish" selected>יהודי</option>
            <option value="christian">נוצרי</option>
            <option value="muslim">מוסלמי</option>
            <option value="none">ללא</option>
          </select>
        </div>
        <div class="form-msg" id="agr-form-msg"></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="agr-submit-btn">שמירה</button>
          <button type="button" class="btn btn-secondary" id="agr-cancel-btn">ביטול</button>
        </div>
      </form>
    </section>
  </div>
</div>

<script>
async function api(path, options) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
  if (res.status === 401) { window.location.href = 'login.html'; throw new Error('not authenticated'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'error');
    err.data = data;
    throw err;
  }
  return data;
}

const HOLIDAY_CAL_LABELS = { jewish: 'יהודי', christian: 'נוצרי', muslim: 'מוסלמי', none: 'ללא' };
let agrCache = [];
let editingCode = null;

function minutesToHHMM(m) { return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; }
function hhmmToMinutes(s) {
  const m = (s || '').trim().match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  const h = Number(m[1]), min = Number(m[2]);
  if (h > 23 || min > 59) return null;
  return h * 60 + min;
}

// Short human labels for the advanced (Phase 4c) fields, used only to render the read-only
// summary panel - these fields have no raw-input counterparts in the manual form, they're
// AI-chat-managed only (see ADVANCED_FIELD_LABELS usage in renderAdvancedSummary below).
const ADVANCED_FIELD_LABELS = {
  break_minutes: 'הפסקה (דק\')', ot_tier1_minutes: 'מדרגה 1 (דק\')', ot_tier1_rate: 'שיעור מדרגה 1',
  ot_tier2_rate: 'שיעור מדרגה 2', night_start_time: 'תחילת לילה', night_end_time: 'סוף לילה',
  night_min_overlap_minutes: 'חפיפת לילה מינ\' (דק\')', night_standard_minutes: 'תקן לילה (דק\')',
  short_weekday: 'יום קצר קבוע', short_weekday_standard_minutes: 'תקן יום קצר (דק\')',
  weekly_rest_entry_time: 'כניסת יום מנוחה', shabbat_premium_rate: 'שיעור תוספת מנוחה',
  holiday_pay_seniority_months: 'ותק לזכאות חג (חוד\')', holiday_pay_averaging_months: 'חלון ממוצע חג (חוד\')'
};
const WEEKDAY_NAMES = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

function renderAdvancedSummary(a) {
  const parts = [];
  for (const [col, label] of Object.entries(ADVANCED_FIELD_LABELS)) {
    const v = a[col];
    if (v === null || v === undefined) continue;
    if (col === 'break_minutes' && v === 0) continue;
    if (col === 'short_weekday') { parts.push(`${label}: ${WEEKDAY_NAMES[v]}`); continue; }
    parts.push(`${label}: ${v}`);
  }
  const extra = a.extra_fields && Object.keys(a.extra_fields).length
    ? Object.values(a.extra_fields).map(f => `${f.label}: ${f.value}`)
    : [];
  if (!parts.length && !extra.length) return '<span class="field-msg">אין כללים מתקדמים</span>';
  return `<details><summary>${parts.length + extra.length} כללים</summary><div class="advanced-fields-list">${
    [...parts, ...extra].map(p => `<div>${p}</div>`).join('')
  }</div></details>`;
}

async function loadAgreements() {
  agrCache = await api('/api/system/agreements');
  const tbody = document.getElementById('agr-tbody');
  tbody.innerHTML = agrCache.length ? agrCache.map(a => `
    <tr>
      <td>${a.code}</td>
      <td>${a.name}</td>
      <td>${minutesToHHMM(a.day_standard_minutes)}</td>
      <td>${minutesToHHMM(a.shortened_day_standard_minutes)}</td>
      <td>${WEEKDAY_NAMES[a.weekly_rest_day]}</td>
      <td>${renderAdvancedSummary(a)}</td>
      <td>
        <button class="btn btn-secondary btn-small edit-agr-btn" data-code="${a.code}">עריכה</button>
        <button class="btn btn-secondary btn-small edit-ai-btn" data-code="${a.code}">עריכה עם AI</button>
      </td>
      <td><button class="btn btn-danger btn-small del-agr-btn" data-code="${a.code}">מחיקה</button></td>
    </tr>`).join('') : '<tr class="empty-row"><td colspan="8">אין עדיין הסכמים</td></tr>';

  tbody.querySelectorAll('.edit-agr-btn').forEach(btn => btn.addEventListener('click', () => openEditAgr(btn.dataset.code)));
  tbody.querySelectorAll('.edit-ai-btn').forEach(btn => btn.addEventListener('click', () => openAiChat(btn.dataset.code)));
  tbody.querySelectorAll('.del-agr-btn').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm(`למחוק את ההסכם ${btn.dataset.code}?`)) return;
    try {
      await api(`/api/system/agreements/${btn.dataset.code}`, { method: 'DELETE' });
      loadAgreements();
    } catch (err) {
      if (err.data && err.data.error === 'has_employees') {
        alert(`יש ${err.data.count} עובדים המשויכים להסכם זה. לא ניתן למחוק אותו כל עוד יש עובדים משויכים אליו.`);
      } else {
        alert(err.message);
      }
    }
  }));
}

const agrForm = document.getElementById('agr-form');
function resetAgrForm() {
  editingCode = null;
  agrForm.reset();
  document.getElementById('agr-code').disabled = false;
  document.getElementById('agr-submit-btn').textContent = 'שמירה';
  document.getElementById('agr-rest-day').value = '6';
  document.getElementById('agr-workdays').value = '6';
  window.__aiAdvancedFields = null;
  window.__aiAdditionalFields = null;
  window.__aiDocument = null;
}
document.getElementById('new-agr-btn').addEventListener('click', () => {
  if (!agrForm.classList.contains('hidden') && editingCode === null) { agrForm.classList.add('hidden'); return; }
  resetAgrForm();
  agrForm.classList.remove('hidden');
});
document.getElementById('agr-cancel-btn').addEventListener('click', () => { resetAgrForm(); agrForm.classList.add('hidden'); });

function openEditAgr(code) {
  const a = agrCache.find(x => x.code === code);
  if (!a) return;
  editingCode = code;
  // Plain "עריכה" entry point - never carries over AI data from a previous, unrelated chat.
  window.__aiAdvancedFields = null;
  window.__aiAdditionalFields = null;
  window.__aiDocument = null;
  document.getElementById('agr-code').value = a.code;
  document.getElementById('agr-code').disabled = true;
  document.getElementById('agr-name').value = a.name;
  document.getElementById('agr-desc').value = a.description || '';
  document.getElementById('agr-prompt').value = a.prompt_text || '';
  document.getElementById('agr-day-standard').value = minutesToHHMM(a.day_standard_minutes);
  document.getElementById('agr-short-standard').value = minutesToHHMM(a.shortened_day_standard_minutes);
  document.getElementById('agr-rest-day').value = a.weekly_rest_day;
  document.getElementById('agr-workdays').value = a.workdays_per_week;
  document.getElementById('agr-holiday-calendar').value = a.holiday_calendar;
  document.getElementById('agr-submit-btn').textContent = 'עדכון';
  document.getElementById('agr-form-msg').textContent = '';
  agrForm.classList.remove('hidden');
  agrForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

const AGR_ERROR_MSGS = {
  'code must be exactly 4 alphanumeric characters': 'קוד ההסכם חייב להיות בדיוק 4 תווים (אותיות/ספרות)',
  'name is required and must be at most 20 characters': 'שם ההסכם חובה ועד 20 תווים',
  'agreement code already exists': 'קוד ההסכם כבר קיים'
};

agrForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('agr-form-msg');
  msg.textContent = ''; msg.className = 'form-msg';

  const dayStandardMinutes = hhmmToMinutes(document.getElementById('agr-day-standard').value);
  const shortenedDayStandardMinutes = hhmmToMinutes(document.getElementById('agr-short-standard').value);
  if (dayStandardMinutes === null || shortenedDayStandardMinutes === null) {
    msg.textContent = 'Invalid time - use HH:MM format';
    msg.className = 'form-msg error';
    return;
  }

  const body = {
    name: document.getElementById('agr-name').value.trim(),
    description: document.getElementById('agr-desc').value.trim(),
    promptText: document.getElementById('agr-prompt').value.trim(),
    dayStandardMinutes, shortenedDayStandardMinutes,
    weeklyRestDay: Number(document.getElementById('agr-rest-day').value),
    workdaysPerWeek: Number(document.getElementById('agr-workdays').value),
    holidayCalendar: document.getElementById('agr-holiday-calendar').value,
    // Advanced fields are AI-chat-managed only (no raw inputs in this form) - whatever the AI
    // assistant most recently derived rides along with the save; a plain manual-only save never
    // touches these (the globals are null unless an AI chat ran earlier this session).
    ...(window.__aiAdvancedFields || {}),
    ...(window.__aiAdditionalFields ? { additionalFields: window.__aiAdditionalFields } : {})
  };
  try {
    if (editingCode) {
      await api(`/api/system/agreements/${editingCode}`, { method: 'PUT', body: JSON.stringify(body) });
    } else {
      body.code = document.getElementById('agr-code').value.trim();
      await api('/api/system/agreements', { method: 'POST', body: JSON.stringify(body) });
    }
    resetAgrForm();
    agrForm.classList.add('hidden');
    loadAgreements();
  } catch (err) {
    msg.textContent = AGR_ERROR_MSGS[err.message] || err.message;
    msg.className = 'form-msg error';
  }
});

/* ---------- AI assistant chat (create AND edit - proposes field values, never saves directly) ---------- */
let aiMessages = [];
let aiBusy = false;

function renderAiMessages() {
  const box = document.getElementById('ai-chat-messages');
  box.innerHTML = aiMessages.map(m => `<div class="ai-msg ai-msg-${m.role}">${m.text.replace(/</g, '&lt;')}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}

// Turns an existing agreement row into the Hebrew "here's what's already defined" description
// that seeds edit-mode conversations - the system prompt is instructed to treat a conversation
// that opens with this as an edit, preserving anything the admin doesn't ask to change.
function describeAgreementForAi(a) {
  const lines = [`הסכם קיים בשם "${a.name}" (קוד ${a.code}).`];
  lines.push(`תקן יום רגיל: ${minutesToHHMM(a.day_standard_minutes)}, תקן יום מקוצר: ${minutesToHHMM(a.shortened_day_standard_minutes)}.`);
  lines.push(`יום מנוחה שבועי: ${WEEKDAY_NAMES[a.weekly_rest_day]}, ${a.workdays_per_week} ימי עבודה בשבוע, לוח חגים: ${HOLIDAY_CAL_LABELS[a.holiday_calendar]}.`);
  for (const [col, label] of Object.entries(ADVANCED_FIELD_LABELS)) {
    const v = a[col];
    if (v === null || v === undefined || (col === 'break_minutes' && v === 0)) continue;
    lines.push(`${label}: ${col === 'short_weekday' ? WEEKDAY_NAMES[v] : v}.`);
  }
  if (a.extra_fields && Object.keys(a.extra_fields).length) {
    lines.push('שדות נוספים: ' + Object.values(a.extra_fields).map(f => `${f.label}: ${f.value}`).join(', ') + '.');
  }
  // The free-text description (if the admin wrote/accumulated one, e.g. from before Phase 4c's
  // structured fields existed) often contains real rules not reflected in the columns above yet -
  // feed it in so the model can extract from it instead of only from what's already structured.
  if (a.prompt_text && a.prompt_text.trim()) {
    lines.push('תיאור חופשי קיים שנכתב בעבר על ההסכם (ייתכן שמכיל כללים שעדיין לא הוגדרו בשדות המובנים למעלה - בדוק אותו וחלץ ממנו כל כלל רלוונטי):');
    lines.push(a.prompt_text.trim());
  }
  lines.push('מה תרצה לשנות או להוסיף?');
  return lines.join('\n');
}

function openAiChat(code) {
  agrForm.classList.add('hidden');
  document.getElementById('ai-chat-panel').classList.remove('hidden');
  document.getElementById('ai-chat-summary').classList.add('hidden');
  document.getElementById('ai-chat-msg').textContent = '';
  window.__aiAdvancedFields = null;
  window.__aiAdditionalFields = null;
  window.__aiDocument = null;

  if (code) {
    const a = agrCache.find(x => x.code === code);
    openEditAgr(code);
    agrForm.classList.add('hidden');
    aiMessages = a ? [{ role: 'model', text: describeAgreementForAi(a) }] : [];
    renderAiMessages();
    return;
  }

  resetAgrForm();
  const seeded = document.getElementById('agr-prompt').value.trim();
  aiMessages = seeded ? [{ role: 'user', text: seeded }] : [];
  renderAiMessages();
  if (seeded) sendAiTurn();
}

document.getElementById('ai-assist-btn').addEventListener('click', () => openAiChat());
document.getElementById('ai-chat-close-btn').addEventListener('click', () => {
  document.getElementById('ai-chat-panel').classList.add('hidden');
});

const BASIC_SUMMARY_KEYS = ['dayStandardMinutes', 'shortenedDayStandardMinutes', 'weeklyRestDay', 'workdaysPerWeek', 'holidayCalendar'];

async function sendAiTurn() {
  if (aiBusy) return;
  aiBusy = true;
  const msg = document.getElementById('ai-chat-msg');
  msg.textContent = '';
  try {
    const result = await api('/api/system/agreements/ai-chat', { method: 'POST', body: JSON.stringify({ messages: aiMessages }) });
    aiMessages.push({ role: 'model', text: result.reply });
    renderAiMessages();
    const summaryBox = document.getElementById('ai-chat-summary');
    if (result.summary) {
      window.__aiSummary = result.summary;
      window.__aiAdvancedFields = Object.fromEntries(
        Object.entries(result.summary).filter(([k]) => !BASIC_SUMMARY_KEYS.includes(k) && k !== 'additionalFields')
      );
      window.__aiAdditionalFields = result.summary.additionalFields || null;
      window.__aiDocument = result.document || null;
      const advancedCount = Object.keys(window.__aiAdvancedFields).length;
      document.getElementById('ai-chat-summary-text').textContent =
        `תקן יום: ${minutesToHHMM(result.summary.dayStandardMinutes)} | יום מקוצר: ${minutesToHHMM(result.summary.shortenedDayStandardMinutes)} | ` +
        `יום מנוחה: ${WEEKDAY_NAMES[result.summary.weeklyRestDay]} | ` +
        `ימי עבודה: ${result.summary.workdaysPerWeek} | לוח חגים: ${HOLIDAY_CAL_LABELS[result.summary.holidayCalendar]}` +
        (advancedCount ? ` | ${advancedCount} כללים מתקדמים` : '');
      summaryBox.classList.remove('hidden');
    } else {
      summaryBox.classList.add('hidden');
      if (result.summaryFailed) {
        msg.textContent = 'העוזר ניסה לסכם אך משהו בנתונים לא תקין - אפשר לנסח מחדש או ללחוץ שוב על "סיום השיחה"';
      }
    }
  } catch (err) {
    msg.textContent = err.message || 'שגיאה בפנייה לעוזר ה-AI';
  } finally {
    aiBusy = false;
  }
}

document.getElementById('ai-chat-send-btn').addEventListener('click', () => {
  const input = document.getElementById('ai-chat-input');
  const text = input.value.trim();
  if (!text) return;
  aiMessages.push({ role: 'user', text });
  input.value = '';
  renderAiMessages();
  sendAiTurn();
});
document.getElementById('ai-chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('ai-chat-send-btn').click();
  }
});
document.getElementById('ai-chat-finish-btn').addEventListener('click', () => {
  aiMessages.push({ role: 'user', text: 'אני מוכן - אנא סכם את מה שלמדת גם אם חסר מידע, והשתמש בברירות מחדל סבירות במקומות חסרים.' });
  renderAiMessages();
  sendAiTurn();
});
document.getElementById('ai-chat-fill-btn').addEventListener('click', () => {
  const s = window.__aiSummary;
  if (!s) return;
  document.getElementById('ai-chat-panel').classList.add('hidden');
  // Edit mode already has editingCode set (from openAiChat's openEditAgr call) and the form
  // primed for that agreement - resetting here would lose that. Create mode starts fresh.
  if (!editingCode) resetAgrForm();
  document.getElementById('agr-day-standard').value = minutesToHHMM(s.dayStandardMinutes);
  document.getElementById('agr-short-standard').value = minutesToHHMM(s.shortenedDayStandardMinutes);
  document.getElementById('agr-rest-day').value = s.weeklyRestDay;
  document.getElementById('agr-workdays').value = s.workdaysPerWeek;
  document.getElementById('agr-holiday-calendar').value = s.holidayCalendar;
  const transcript = aiMessages.filter(m => m.role === 'user').map(m => m.text).join('\n');
  document.getElementById('agr-prompt').value = window.__aiDocument || transcript;
  agrForm.classList.remove('hidden');
  agrForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
});

/* ---------- init ---------- */
api('/api/system/me').then(loadAgreements);
</script>
</body>
</html>
