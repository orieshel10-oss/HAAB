<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HAAB - אישור דיווחים</title>
<meta name="theme-color" content="#2f6fed" />
<link rel="icon" href="../icons/icon-192.png" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="admin.css" />
<script src="admin-common.js"></script>
</head>
<body>
<div class="admin-wrap">
  <div id="org-header-root"></div>

  <div class="admin-content">
    <section class="admin-section">
      <div class="admin-section-head">
        <h2>אישור דיווחי נוכחות</h2>
        <button class="btn btn-secondary btn-small" id="toggle-filter-btn">הצגת הכל</button>
        <button class="btn btn-primary btn-small" id="approve-all-btn">אשר הכל</button>
      </div>
      <div class="cal-nav">
        <button class="cal-nav-btn" id="appr-prev">›</button>
        <div class="cal-title" id="appr-month-title"></div>
        <button class="cal-nav-btn" id="appr-next">‹</button>
      </div>
      <table class="admin-table">
        <thead><tr><th>עובד</th><th>תאריך</th><th>דיווח</th><th>סה"כ שעות</th><th>סטטוס</th><th></th></tr></thead>
        <tbody id="appr-tbody"><tr class="empty-row"><td colspan="6">טוען...</td></tr></tbody>
      </table>

      <!-- Admin day editor (Phase 4f): opened per row to correct/add an employee's report for
           that date - reuses the employee PWA's own day-panel CSS classes from ../styles.css
           (already linked above). Always writes to attendance_reports; real clock punches (shown
           read-only) stay untouched. -->
      <div class="day-panel appr-editor hidden" id="appr-day-editor" style="margin-top:16px;max-width:420px;">
        <div class="day-panel-header">
          <div class="day-panel-weekday" id="appr-editor-employee-name"></div>
          <div class="day-panel-date" id="appr-editor-date-label"></div>
        </div>
        <div class="day-panel-clock-line">
          <span>דיווחי שעון</span>
          <span id="appr-editor-clock-events">אין</span>
        </div>
        <div class="day-panel-reports-head">
          <span>דיווחי נוכחות</span>
          <button type="button" class="day-panel-add-btn" id="appr-editor-add-btn">+</button>
        </div>
        <div class="day-panel-reports-list" id="appr-editor-reports-list"></div>

        <form class="day-panel-editor hidden" id="appr-report-form">
          <select class="report-select" id="appr-report-type"></select>
          <label class="whole-day-toggle hidden" id="appr-report-wholeday-wrap">
            <input type="checkbox" id="appr-report-wholeday" />
            <span>יום שלם</span>
          </label>
          <div class="time-row" id="appr-report-time-row">
            <div class="time-field">
              <label>שעת כניסה</label>
              <input type="time" id="appr-report-entry" />
            </div>
            <div class="time-field">
              <label>שעת יציאה</label>
              <input type="time" id="appr-report-exit" />
            </div>
          </div>
          <button type="button" class="link-btn-small" id="appr-report-note-toggle">+ הוספת הערה</button>
          <textarea id="appr-report-note" class="hidden" placeholder="הערה"></textarea>
          <div class="modal-actions">
            <button type="button" class="modal-secondary" id="appr-report-cancel">ביטול</button>
            <button type="submit" class="modal-primary" id="appr-report-save">שמירה</button>
          </div>
        </form>
        <button type="button" class="link-btn-small" id="appr-editor-close">סגירת עריכה</button>
      </div>
    </section>
  </div>
</div>

<div class="modal-overlay-simple hidden" id="reject-modal-overlay">
  <div class="modal-card-simple">
    <h3>סיבת דחייה</h3>
    <textarea id="reject-reason-input" rows="4" style="width:100%;border:1px solid var(--border);border-radius:9px;padding:9px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--text);"></textarea>
    <div class="field-msg error" id="reject-modal-msg"></div>
    <div class="form-actions">
      <button class="btn btn-primary" id="reject-modal-confirm">דחייה</button>
      <button class="btn btn-secondary" id="reject-modal-cancel">ביטול</button>
    </div>
  </div>
</div>

<script>
async function api(path, options) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
  if (res.status === 401) { window.location.href = 'org-login.html'; throw new Error('not authenticated'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'error');
    err.data = data;
    throw err;
  }
  return data;
}

const WEEKDAYS = ['א','ב','ג','ד','ה','ו','ש'];
const MONTH_NAMES = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const STATUS_LABELS = { pending: 'ממתין לאישור', approved: 'מאושר', rejected: 'נדחה' };
const STATUS_CLASSES = { pending: '', approved: 'note-vacation', rejected: 'note-sick' };

function minutesToLabel(m) { return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; }
function fmtDate(iso) {
  const [y, mo, d] = iso.split('-').map(Number);
  const weekday = new Date(y, mo - 1, d).getDay();
  return `${WEEKDAYS[weekday]} ${String(d).padStart(2, '0')}/${String(mo).padStart(2, '0')}`;
}

let me = null;
let state = { year: new Date().getFullYear(), month: new Date().getMonth() + 1 };
let filter = 'pending';

function setMonth(delta) {
  state.month += delta;
  if (state.month > 12) { state.month = 1; state.year++; }
  if (state.month < 1) { state.month = 12; state.year--; }
  loadApprovals();
}
document.getElementById('appr-prev').addEventListener('click', () => setMonth(-1));
document.getElementById('appr-next').addEventListener('click', () => setMonth(1));

document.getElementById('toggle-filter-btn').addEventListener('click', () => {
  filter = filter === 'pending' ? 'all' : 'pending';
  document.getElementById('toggle-filter-btn').textContent = filter === 'pending' ? 'הצגת הכל' : 'רק ממתינים לאישור';
  renderTable();
});

let rowsCache = [];

async function loadApprovals() {
  document.getElementById('appr-month-title').textContent = `${MONTH_NAMES[state.month - 1]} ${state.year}`;
  document.getElementById('appr-tbody').innerHTML = '<tr class="empty-row"><td colspan="6">טוען...</td></tr>';
  rowsCache = await api(`/api/org/approvals?year=${state.year}&month=${state.month}`);
  renderTable();
}

let REPORT_TYPES_BY_CODE = {};
async function loadReportTypes() {
  const today = new Date().toISOString().slice(0, 10);
  const types = await api('/api/org/report-types');
  REPORT_TYPES_BY_CODE = {};
  types.filter(t => t.whitelisted && (!t.effectiveFrom || t.effectiveFrom <= today) && (!t.effectiveUntil || t.effectiveUntil >= today))
    .forEach(t => { REPORT_TYPES_BY_CODE[t.code] = t; });
}
function reportTypeLabel(type) {
  if (type === 'attendance') return 'נוכחות';
  return (REPORT_TYPES_BY_CODE[type] || {}).name || type;
}
function buildTypeOptions(selected) {
  return [
    { value: 'attendance', label: 'נוכחות' },
    ...Object.values(REPORT_TYPES_BY_CODE).map(t => ({ value: t.code, label: t.name }))
  ].map(o => `<option value="${o.value}" ${o.value === selected ? 'selected' : ''}>${o.label}</option>`).join('');
}
function rowSummaryLabel(row) {
  return row.summary.map(s => `${reportTypeLabel(s.type)}: ${s.timeLabel}`).join(', ');
}
function fmtTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function shiftIsoDate(iso, deltaDays) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + deltaDays);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
}

function renderTable() {
  const tbody = document.getElementById('appr-tbody');
  const rows = filter === 'pending' ? rowsCache.filter(r => r.status === 'pending') : rowsCache;
  tbody.innerHTML = rows.length ? rows.map(r => `
    <tr data-employee="${r.employeeId}" data-date="${r.date}" data-name="${r.employeeName}">
      <td>${r.employeeName}</td>
      <td>${fmtDate(r.date)}</td>
      <td>${rowSummaryLabel(r)}</td>
      <td>${r.totalMinutes ? minutesToLabel(r.totalMinutes) : ''}</td>
      <td class="${STATUS_CLASSES[r.status]}">
        ${STATUS_LABELS[r.status]}
        ${r.status === 'rejected' ? `<div class="field-msg">${r.rejectionReason}</div>` : ''}
        ${r.status !== 'pending' ? `<div class="field-msg">${r.reviewedByName || ''}</div>` : ''}
      </td>
      <td>
        ${r.status === 'pending' ? `
          <button class="btn btn-primary btn-small approve-btn">אשר</button>
          <button class="btn btn-danger btn-small reject-btn">דחה</button>
        ` : ''}
        ${r.status === 'rejected' ? `<button class="btn btn-secondary btn-small unreject-btn">ביטול דחייה</button>` : ''}
        <button class="btn btn-secondary btn-small edit-day-btn">עריכה</button>
      </td>
    </tr>`).join('') : `<tr class="empty-row"><td colspan="6">${filter === 'pending' ? 'אין דיווחים הממתינים לאישור' : 'אין דיווחים בחודש זה'}</td></tr>`;

  tbody.querySelectorAll('.approve-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('tr');
      btn.disabled = true;
      try {
        await api('/api/org/approvals/approve', {
          method: 'POST',
          body: JSON.stringify({ employeeId: Number(row.dataset.employee), date: row.dataset.date })
        });
        await loadApprovals();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    });
  });

  tbody.querySelectorAll('.reject-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const row = btn.closest('tr');
      openRejectModal(Number(row.dataset.employee), row.dataset.date);
    });
  });

  tbody.querySelectorAll('.unreject-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('tr');
      btn.disabled = true;
      try {
        await api('/api/org/approvals/unreject', {
          method: 'POST',
          body: JSON.stringify({ employeeId: Number(row.dataset.employee), date: row.dataset.date })
        });
        await loadApprovals();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    });
  });

  tbody.querySelectorAll('.edit-day-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const row = btn.closest('tr');
      openDayEditor(Number(row.dataset.employee), row.dataset.name, row.dataset.date);
    });
  });
}

let rejectTarget = null;
function openRejectModal(employeeId, date) {
  rejectTarget = { employeeId, date };
  document.getElementById('reject-reason-input').value = '';
  document.getElementById('reject-modal-msg').textContent = '';
  document.getElementById('reject-modal-overlay').classList.remove('hidden');
}
document.getElementById('reject-modal-cancel').addEventListener('click', () => {
  document.getElementById('reject-modal-overlay').classList.add('hidden');
});
document.getElementById('reject-modal-confirm').addEventListener('click', async () => {
  const reason = document.getElementById('reject-reason-input').value.trim();
  const msg = document.getElementById('reject-modal-msg');
  if (!reason) { msg.textContent = 'נדרש לציין סיבת דחייה'; return; }
  const btn = document.getElementById('reject-modal-confirm');
  btn.disabled = true;
  try {
    await api('/api/org/approvals/reject', {
      method: 'POST',
      body: JSON.stringify({ employeeId: rejectTarget.employeeId, date: rejectTarget.date, reason })
    });
    document.getElementById('reject-modal-overlay').classList.add('hidden');
    await loadApprovals();
  } catch (err) {
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('approve-all-btn').addEventListener('click', async () => {
  if (!confirm(`לאשר את כל הדיווחים הממתינים של ${MONTH_NAMES[state.month - 1]} ${state.year}?`)) return;
  const btn = document.getElementById('approve-all-btn');
  btn.disabled = true;
  try {
    const result = await api('/api/org/approvals/approve-all', {
      method: 'POST',
      body: JSON.stringify({ year: state.year, month: state.month })
    });
    await loadApprovals();
    alert(`אושרו ${result.count} דיווחים`);
  } catch (err) {
    alert(err.message);
  } finally {
    btn.disabled = false;
  }
});

/* ---------- admin day editor (Phase 4f): mirrors the employee PWA's own day-panel editor, but
   for a different employee's day, via /api/org/approvals/day + /approvals/reports*. ---------- */
let editorEmployeeId = null;
let editorDate = null;
let editorReports = [];
let editingReportId = null;
let editorExitConfirmed = false;

async function openDayEditor(employeeId, employeeName, date) {
  editorEmployeeId = employeeId;
  editorDate = date;
  editingReportId = null;
  const day = await api(`/api/org/approvals/day?employeeId=${employeeId}&date=${date}`);
  editorReports = day.reports;

  document.getElementById('appr-editor-employee-name').textContent = employeeName;
  const [y, mo, d] = date.split('-').map(Number);
  document.getElementById('appr-editor-date-label').textContent = `${String(d).padStart(2, '0')}.${String(mo).padStart(2, '0')}.${y}`;

  const clockSessions = [];
  let openIn = null;
  day.events.forEach(ev => {
    if (ev.type === 'in') { openIn = ev.ts; }
    else if (ev.type === 'out' && openIn) { clockSessions.push(`${fmtTime(openIn)}-${fmtTime(ev.ts)}`); openIn = null; }
  });
  if (openIn) clockSessions.push(`${fmtTime(openIn)}-`);
  document.getElementById('appr-editor-clock-events').textContent = clockSessions.length ? clockSessions.join(', ') : 'אין';

  renderEditorReportsList();
  closeReportForm();
  document.getElementById('appr-day-editor').classList.remove('hidden');
  document.getElementById('appr-day-editor').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderEditorReportsList() {
  const list = document.getElementById('appr-editor-reports-list');
  if (!editorReports.length) {
    list.innerHTML = '<div class="day-panel-empty">לא דווחה נוכחות</div>';
    return;
  }
  list.innerHTML = editorReports.map(r => {
    const timeLabel = !r.entryTs ? 'יום שלם' : (r.exitTs ? `${fmtTime(r.entryTs)} - ${fmtTime(r.exitTs)}` : `${fmtTime(r.entryTs)} -`);
    return `
      <div class="day-panel-report-row" data-id="${r.id}">
        <button type="button" class="day-panel-report-delete" data-id="${r.id}" title="מחיקה">🗑</button>
        <span class="day-panel-report-type">${reportTypeLabel(r.type)}</span>
        <span class="day-panel-report-time">${timeLabel}</span>
      </div>`;
  }).join('');

  list.querySelectorAll('.day-panel-report-delete').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('למחוק את הדיווח?')) return;
      await api(`/api/org/approvals/reports/${btn.dataset.id}`, { method: 'DELETE' });
      await openDayEditor(editorEmployeeId, document.getElementById('appr-editor-employee-name').textContent, editorDate);
      await loadApprovals();
    });
  });
  list.querySelectorAll('.day-panel-report-row').forEach(row => {
    row.addEventListener('click', () => openReportForm(editorReports.find(r => String(r.id) === row.dataset.id)));
  });
}

function syncReportFormVisibility() {
  const type = document.getElementById('appr-report-type').value;
  const wholeDayWrap = document.getElementById('appr-report-wholeday-wrap');
  const wholeDayChecked = document.getElementById('appr-report-wholeday').checked;
  wholeDayWrap.classList.toggle('hidden', type === 'attendance');
  if (type === 'attendance') document.getElementById('appr-report-wholeday').checked = false;
  document.getElementById('appr-report-time-row').style.display = (type !== 'attendance' && wholeDayChecked) ? 'none' : 'flex';
}

function openReportForm(report) {
  editingReportId = report ? report.id : null;
  const form = document.getElementById('appr-report-form');
  document.getElementById('appr-report-type').innerHTML = buildTypeOptions(report ? report.type : 'attendance');
  document.getElementById('appr-report-wholeday').checked = !!(report && !report.entryTs);
  document.getElementById('appr-report-entry').value = report && report.entryTs ? fmtTime(report.entryTs) : '00:00';
  document.getElementById('appr-report-exit').value = report && report.exitTs ? fmtTime(report.exitTs) : '00:00';
  editorExitConfirmed = !!(report && report.exitTs);
  const note = document.getElementById('appr-report-note');
  note.value = (report && report.note) || '';
  note.classList.toggle('hidden', !(report && report.note));
  document.getElementById('appr-report-note-toggle').classList.toggle('hidden', !!(report && report.note));
  syncReportFormVisibility();
  form.classList.remove('hidden');
  form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeReportForm() {
  editingReportId = null;
  editorExitConfirmed = false;
  const form = document.getElementById('appr-report-form');
  form.reset();
  document.getElementById('appr-report-entry').value = '00:00';
  document.getElementById('appr-report-exit').value = '00:00';
  document.getElementById('appr-report-note').classList.add('hidden');
  document.getElementById('appr-report-note-toggle').classList.remove('hidden');
  form.classList.add('hidden');
}

document.getElementById('appr-report-entry').addEventListener('change', (e) => {
  if (!e.target.value) e.target.value = '00:00';
});
document.getElementById('appr-report-exit').addEventListener('change', (e) => {
  if (!e.target.value) { e.target.value = '00:00'; editorExitConfirmed = false; }
  else editorExitConfirmed = true;
});

document.getElementById('appr-editor-add-btn').addEventListener('click', () => openReportForm(null));
document.getElementById('appr-report-cancel').addEventListener('click', closeReportForm);
document.getElementById('appr-report-type').addEventListener('change', syncReportFormVisibility);
document.getElementById('appr-report-wholeday').addEventListener('change', syncReportFormVisibility);
document.getElementById('appr-report-note-toggle').addEventListener('click', () => {
  document.getElementById('appr-report-note').classList.remove('hidden');
  document.getElementById('appr-report-note-toggle').classList.add('hidden');
});
document.getElementById('appr-editor-close').addEventListener('click', () => {
  document.getElementById('appr-day-editor').classList.add('hidden');
});

document.getElementById('appr-report-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const type = document.getElementById('appr-report-type').value;
  const wholeDay = type !== 'attendance' && document.getElementById('appr-report-wholeday').checked;
  const entry = document.getElementById('appr-report-entry').value;
  const exit = document.getElementById('appr-report-exit').value;
  const note = document.getElementById('appr-report-note').value.trim();

  if (!wholeDay && !entry) {
    alert('יש להזין שעת כניסה, או לסמן יום שלם');
    return;
  }

  const exitGiven = !wholeDay && editorExitConfirmed;
  const body = {
    employeeId: editorEmployeeId, date: editorDate, type, wholeDay,
    entry: wholeDay ? null : entry, exit: exitGiven ? exit : null, note: note || null
  };
  if (exitGiven) body.exitDate = exit < entry ? shiftIsoDate(editorDate, 1) : editorDate;

  if (editingReportId) {
    await api(`/api/org/approvals/reports/${editingReportId}`, { method: 'PUT', body: JSON.stringify(body) });
  } else {
    await api('/api/org/approvals/reports', { method: 'POST', body: JSON.stringify(body) });
  }

  await openDayEditor(editorEmployeeId, document.getElementById('appr-editor-employee-name').textContent, editorDate);
  await loadApprovals();
});

/* ---------- init ---------- */
api('/api/org/me').then(async (data) => {
  me = data;
  renderOrgHeader({ me, active: 'approvals' });
  await loadReportTypes();
  await loadApprovals();
});
</script>
</body>
</html>
