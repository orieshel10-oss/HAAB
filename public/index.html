<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>נוכחות</title>
<meta name="theme-color" content="#2f6fed" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <!-- מסך ראשי -->
  <section class="screen active" id="screen-home">
    <header class="topbar">
      <h1>נוכחות</h1>
    </header>
    <div class="content">
      <div class="clock-card">
        <div class="clock-time" id="clock-time">--:--:--</div>
        <div class="clock-date" id="clock-date"></div>
      </div>

      <div class="status-card" id="status-card">
        <div class="status-dot" id="status-dot"></div>
        <div class="status-text" id="status-text">טוען...</div>
        <div class="status-sub" id="status-sub"></div>
      </div>

      <div class="clock-buttons">
        <button class="clock-btn in" id="btn-in">
          <span class="clock-btn-icon">↓</span>
          <span>כניסה</span>
        </button>
        <button class="clock-btn out" id="btn-out">
          <span class="clock-btn-icon">↑</span>
          <span>יציאה</span>
        </button>
      </div>

      <nav class="menu-list">
        <button class="menu-item" data-nav="update">
          <span class="menu-icon">📝</span>
          <span class="menu-label">עדכון נוכחות</span>
          <span class="menu-arrow">‹</span>
        </button>
        <button class="menu-item" data-nav="sheet">
          <span class="menu-icon">📊</span>
          <span class="menu-label">גליון מנותח</span>
          <span class="menu-arrow">‹</span>
        </button>
      </nav>
    </div>
  </section>

  <!-- מסך עדכון נוכחות: מאחד דיווח היעדרות + השלמת נוכחות + עדכון דיווחים קיימים -->
  <section class="screen" id="screen-update">
    <header class="topbar">
      <button class="back-btn" data-back>›</button>
      <h1>עדכון נוכחות</h1>
    </header>
    <div class="content">
      <div class="cal-nav">
        <button class="cal-nav-btn" data-cal-prev="update">›</button>
        <div class="cal-title" id="update-cal-title"></div>
        <button class="cal-nav-btn" data-cal-next="update">‹</button>
      </div>
      <div class="calendar" id="update-calendar"></div>
      <div class="legend">
        <span class="legend-item"><i class="dot vacation"></i> חופשה</span>
        <span class="legend-item"><i class="dot sick"></i> מחלה</span>
      </div>
    </div>
  </section>

  <!-- מסך גליון מנותח: פריסת שעות לפי חוק + היעדרויות -->
  <section class="screen" id="screen-sheet">
    <header class="topbar">
      <button class="back-btn" data-back>›</button>
      <h1>גליון מנותח</h1>
    </header>
    <div class="content">
      <div class="cal-nav">
        <button class="cal-nav-btn" data-cal-prev="sheet">›</button>
        <div class="cal-title" id="sheet-cal-title"></div>
        <button class="cal-nav-btn" data-cal-next="sheet">‹</button>
      </div>
      <div class="sheet-table-wrap">
        <table class="sheet-table">
          <thead>
            <tr>
              <th>תאריך</th>
              <th>יום</th>
              <th>כניסה</th>
              <th>יציאה</th>
              <th>רגילות</th>
              <th>125%</th>
              <th>150%</th>
              <th>שבת</th>
              <th>הערה</th>
            </tr>
          </thead>
          <tbody id="sheet-tbody"></tbody>
          <tfoot id="sheet-tfoot"></tfoot>
        </table>
      </div>
      <p class="sheet-note">* ניתוח אחיד לפי חוק שעות עבודה ומנוחה (יום עבודה 8 שעות, 7 שעות בערב שבת, 125%/150% על שעות נוספות), בהנחה ששבת הוא יום המנוחה. בהמשך הניתוח יתחשב בהסכם הנוכחות האישי של כל עובד.</p>
    </div>
  </section>

</div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="app.js"></script>
</body>
</html>
